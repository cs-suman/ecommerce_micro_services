spring:
  application:
    name: apigateway

  cloud:
    gateway:
      routes:
        - id: product-service
          uri: http://localhost:8081
          predicates:
            - path=/api/products/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - path=/api/users/**
        - id: cart-service
          uri: http://localhost:8083
          predicates:
            - path=/api/orders/**, /api/cart/**

server:
  port: 8080